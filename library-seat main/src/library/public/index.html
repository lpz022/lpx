<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>图书馆座位管理后台 · 原型</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header class="topbar">
		<h1>图书馆座位管理后台（原型）</h1>
		<div class="actions">
			<a href="/users.html"><button type="button">用户管理</button></a>
			<a href="/sensor.html"><button type="button">传感器模拟器</button></a>
			<button id="refreshBtn">刷新</button>
			<label>
				自动刷新
				<input type="checkbox" id="autoRefresh" checked>
			</label>
		</div>
	</header>
	<main class="container">
		<section class="panel">
			<h2>座位状态看板</h2>
			<div class="toolbar">
				<select id="userSelect"></select>
				<span class="hint">选择用户后，可在表格中为其分配座位</span>
			</div>
			<table class="seats" id="seatsTable">
				<thead>
					<tr>
						<th>编号</th>
						<th>名称</th>
						<th>状态</th>
						<th>当前用户</th>
						<th>操作</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</section>
	</main>
	<script src="/app.js"></script>
</body>
</html>
