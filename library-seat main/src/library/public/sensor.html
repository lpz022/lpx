<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>传感器模拟器 · 图书馆座位系统</title>
	<link rel="stylesheet" href="/styles.css">
	<style>
		.sensor-panel { background: #1a1d27; border: 1px solid #2b3040; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
		.sensor-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
		.sensor-control { background: #0e1117; border: 1px solid #2b3040; border-radius: 8px; padding: 12px; }
		.sensor-control h4 { margin: 0 0 8px 0; color: #4cc9f0; }
		.sensor-status { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
		.status-indicator { width: 12px; height: 12px; border-radius: 50%; }
		.status-indicator.pressure { background: #2ecc71; }
		.status-indicator.card { background: #f1c40f; }
		.status-indicator.static { background: #e74c3c; }
		.status-indicator.none { background: #95a5a6; }
		.simulator-actions { display: flex; gap: 12px; margin-top: 16px; }
		.batch-controls { display: flex; gap: 8px; align-items: center; }
	</style>
</head>
<body>
	<header class="topbar">
		<h1>传感器模拟器</h1>
		<div class="actions">
			<a href="/"><button type="button">返回主页</button></a>
			<button id="refreshSensors">刷新</button>
			<button id="resetAll">重置所有</button>
		</div>
	</header>
	<main class="container">
		<section class="sensor-panel">
			<h2>传感器状态说明</h2>
			<div class="sensor-status">
				<span class="status-indicator pressure"></span>
				<span>有持续变化的压力 → 有人在座</span>
			</div>
			<div class="sensor-status">
				<span class="status-indicator card"></span>
				<span>刷了卡但无压力 → 违规使用</span>
			</div>
			<div class="sensor-status">
				<span class="status-indicator static"></span>
				<span>压力持续不变 → 违规使用</span>
			</div>
			<div class="sensor-status">
				<span class="status-indicator none"></span>
				<span>无压力无刷卡 → 空闲</span>
			</div>
		</section>

		<section class="sensor-panel">
			<h2>批量操作</h2>
			<div class="batch-controls">
				<select id="batchAction">
					<option value="">选择批量操作...</option>
					<option value="pressure">全部设为"有压力"</option>
					<option value="card">全部设为"刷卡无压力"</option>
					<option value="static">全部设为"压力不变"</option>
					<option value="none">全部设为"无状态"</option>
				</select>
				<button id="applyBatch">应用</button>
			</div>
		</section>

		<section class="sensor-panel">
			<h2>座位传感器设置</h2>
			<div class="sensor-controls" id="sensorControls">
				<!-- 动态生成座位传感器控制 -->
			</div>
		</section>
	</main>
	<script src="/sensor.js"></script>
</body>
</html>
